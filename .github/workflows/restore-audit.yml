name: Assemble verified audit package
on:
  push:
    branches: [codex/auditor-documentation]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/codex/auditor-documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify recovered sources against the pre-interruption manifest
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('docs/audit/manifest.json','utf8'));
          for(const [file,expected]of Object.entries(manifest.sourceSHA256)){
            const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(actual!==expected)throw Error('Recovered source mismatch: '+file);
          }
          console.log('All 28 recovered source files match the verified manifest.');
          JS
      - name: Install pinned documentation tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the complete regression suite and retain its actual log
        shell: bash
        run: |
          set -o pipefail
          node --version
          node --test --test-concurrency=1 reporting.test.js dynamics.test.js initialization.test.js model.test.js worker.test.js run-seeds.test.js audit.test.js visualization.test.js adaptation.test.js stress.test.js | tee docs/audit/test-results.txt
      - name: Rebuild and verify the entire audit package
        run: |
          npm run docs:build
          npm run docs:check
      - name: Preserve the verified generated package on the documentation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit
          git commit -m "Complete the hash-verified auditor documentation package"
          git push origin HEAD:refs/heads/codex/auditor-documentation
